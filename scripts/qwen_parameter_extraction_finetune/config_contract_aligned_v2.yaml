# PE contract-aligned v2 — SFT rebuild config (supersedes v1).
#
# v1 was built against an EARLIER production prompt (per-capability prose); the
# current production contract exposes ONE interface-only prompt (SYSTEM_EXTRACT)
# and a `query` description with NO semantic-cleaning rule. v1 therefore fails the
# live byte-render check. v2 rebuilds against the CURRENT contract, non-destructively:
# every earlier artifact (data/, data_contract_aligned_v1/) is left untouched.
#
# Only `output.*` differs from config.yaml; `source.*` and `build.*` are IDENTICAL
# so the bundles stay byte-comparable modulo the contract change.
#
# Run: python prepare_dataset.py --config config_contract_aligned_v2.yaml

source:
  train_candidates: data/delveta_parameter_extraction_v2/delveta_pe_train_candidate_6000.jsonl
  test_candidates:  data/delveta_parameter_extraction_v2/delveta_pe_test_candidate_6000.jsonl
  formal500:        logs/_argbench/dataset_formal500.jsonl
  source_commit:    fdf96cf

output:
  data_dir:      data_contract_aligned_v2
  manifests_dir: manifests_contract_aligned_v2
  reports_dir:   reports_contract_aligned_v2
  snapshot_source: false

build:
  seed: 20261011
  include_clarify_rows: false
  near_dup_jaccard: 0.90
  split_policy: cluster
  split:
    train: 0.80
    validation: 0.10
    test: 0.10
