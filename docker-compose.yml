# Delveta — data + model-serving infrastructure.
#
# The FastAPI app itself runs on the host during development (uvicorn), and talks to
# these containers over HTTP. Model inference (LLM / embedding / TTS / STT) never
# runs inside the API process, so model updates don't require an API restart.
# (Rerank is the exception: it is an in-process cross-encoder inside the RAG pipeline,
# enabled by RERANKER_MODEL — see the reranker service note below.)
#
# Model services:
#   - embedding   Delveta-BGE-M3-v1 INT8 (onnxruntime)-> POST /embed   (port 18080)
#   - reranker    LEGACY TEI container — not wired (rerank runs in-process)   (port 18081)
#   - tts         Kokoro-FastAPI (OpenAI-compatible)  -> /v1/audio/speech (port 18880)
#   - stt         FunASR serving SenseVoiceSmall      -> /v1/audio/transcriptions (port 18881, loopback only)
#   - tool-intent   Ollama serving the argument-extractor model (never selects)
#                 (OpenAI-compatible /v1/chat/completions, port 18091, loopback only)
#   - llm-gateway LiteLLM proxy (unified LLM routing / keys / cost)   (port 14000)

name: delveta

# One pin, one place: both halves of the tool-intent model lifecycle read these.
# `tool-intent-model` downloads and verifies the GGUF; `tool-intent` registers
# and serves it.
x-tool-intent-model: &tool-intent-model
  TOOL_INTENT_MODEL_REPO: ${TOOL_INTENT_MODEL_REPO:-eric-ml-nlp/Delveta-Qwen3-0.6B-PE-v1}
  TOOL_INTENT_MODEL_REVISION: ${TOOL_INTENT_MODEL_REVISION:-1a75945e12bfeb203910bdb765e7cdf07f6a1126}
  TOOL_INTENT_MODEL_FILE: ${TOOL_INTENT_MODEL_FILE:-Q5_K_M/model.gguf}
  TOOL_INTENT_MODEL_SHA256: ${TOOL_INTENT_MODEL_SHA256:-17772c20f3bf356f251c29816b24000dfdbf4b412755024dc087ae63591b98f6}
  TOOL_INTENT_MODEL_SIZE: ${TOOL_INTENT_MODEL_SIZE:-444414752}
  HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
  HF_TOKEN: ${HF_TOKEN:-}
  # model_store downloads with plain HTTP Range requests and keeps partial bytes
  # inside this volume, so a recreated container resumes. Xet's chunk cache lives
  # in the container filesystem; disable it so nothing reintroduces a cache that
  # disappears with the container.
  HF_HUB_DISABLE_XET: "1"

services:
  # ── Data ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: delveta-postgres
    environment:
      POSTGRES_USER: delveta
      POSTGRES_PASSWORD: delveta
      POSTGRES_DB: delveta
    ports:
      # 5432 sits inside a Windows Hyper-V excluded port range on some hosts; use 15432 instead.
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delveta"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: delveta-redis
    ports:
      # 6379 sits inside a Windows Hyper-V excluded port range on some hosts; use 16379 instead.
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Embedding (Delveta-BGE-M3-v1 INT8, onnxruntime) ───────────────────
  # The DEFAULT embedding backend, on the SAME POST /embed contract the retired
  # TEI container spoke (port 18080), so core.infrastructure.vector.TEIEmbedder
  # is unchanged. Backed by the validated fine-tuned INT8 ONNX graph (CLS pooling
  # + L2 norm inside the graph, 1024-dim).
  #
  # The checkpoint lives in the Docker-managed named volume `embedding-model`,
  # NOT on a host path: the entrypoint downloads the configured revision from
  # the Hugging Face repo, verifies every file's size + SHA256, and publishes it
  # under /model/current before uvicorn starts. Container recreation reuses the
  # volume; `docker compose down` keeps it; only `docker compose down -v`
  # deletes it (the next boot re-downloads ~0.57 GB).
  #
  # Model pins are NOT in the image. They arrive as MODEL_SPEC_JSON from
  # deploy/model_config/embedding.env (Compose env_file, read at container
  # creation). To change a model: edit that file, then
  #   docker compose up -d --force-recreate embedding
  # Compose recreates the container because its environment changed; no image
  # rebuild and no host mount is involved. `docker compose restart` does NOT
  # pick up a new env file value.
  # There is NO fallback to BAAI/bge-m3: an unverifiable model aborts the
  # container at boot.
  # Build source: deploy/embedding_int8 (rebuild only if the image is missing).
  embedding:
    build:
      context: ./deploy
      dockerfile: embedding_int8/Dockerfile
    image: delveta-embedding-int8:latest
    container_name: delveta-embedding
    command: uvicorn server:app --host 0.0.0.0 --port 80
    ports:
      - "18080:80"
    env_file:
      - ./deploy/model_config/embedding.env
    volumes:
      - embedding-model:/model
    environment:
      MAX_LEN: "64"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      # See the note on the tool-intent model pin above: HTTP partials live in
      # the volume, so an interrupted download resumes after a container swap.
      HF_HUB_DISABLE_XET: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:80/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous: a cold volume must download and hash ~0.57 GB first.
      start_period: 900s

  # ── Reranker (BGE-reranker-v2-m3 via TEI) ─────────────────────────────
  # NOTE: not currently wired into the app — rag.rank.cross_encoder uses sentence-transformers
  # CrossEncoder in-process (config.reranker_model), not this HTTP service. BGE-reranker-v2-m3
  # also ships without ONNX weights, so TEI cannot serve it as-is. Leave this stopped unless
  # you export the model to ONNX first.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: delveta-reranker
    command: --model-id BAAI/bge-reranker-v2-m3 --port 80 --max-batch-tokens 2048 --max-concurrent-requests 16
    ports:
      - "18081:80"
    volumes:
      - reranker-cache:/data
    restart: unless-stopped
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}

  # ── TTS (Kokoro-82M via Kokoro-FastAPI) ───────────────────────────────
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: delveta-tts
    ports:
      - "18880:8880"
    volumes:
      - kokoro-cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # GPU variant: image: ghcr.io/remsky/kokoro-fastapi-gpu:latest

  # ── STT (FunASR serving SenseVoiceSmall, OpenAI-compatible /v1/audio/transcriptions) ──
  # Built locally from deploy/stt/Dockerfile. Host port is bound to loopback only: the
  # host-run API gateway reaches it at http://localhost:18881/v1 (same mechanism as TTS).
  # start_period is generous because the first boot downloads the model + fsmn-vad into
  # the funasr-cache volume; later restarts reuse it with no network access.
  stt:
    build: ./deploy/stt
    image: delveta-stt:latest
    container_name: delveta-stt
    ports:
      - "127.0.0.1:18881:8000"
    volumes:
      - funasr-cache:/root/.cache/modelscope
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # ── Argument extractor (chat intent funnel's MODEL-owned slot extraction).
  # Capability SELECTION is owned by the cap_router service; this service never
  # picks a capability. Standalone, replaceable inference service: the funnel
  # only speaks the OpenAI-compatible /v1/chat/completions exchange
  # (intent_funnel/argument_acquisition/extractor.py), so BOTH ends of the
  # provider seam are config, never code:
  #   provider       = ollama (today; vLLM / llama.cpp server are drop-ins —
  #                  same OpenAI wire, zero business-logic change)
  #   model          = delveta-pe  — the fine-tuned Delveta-Qwen3-0.6B-PE-v1
  #                  checkpoint; swap via TOOL_INTENT_OLLAMA_MODEL
  #   quantization   = Q5_K_M (current; Ollama encodes it in the tag, so the
  #                  full current tag is delveta-pe:q5km)
  # Weight/config live in the named volume only; the app never references a
  # model name in business logic (config.py chat_tool_intent_local_model +
  # this env var are the ONLY places the tag appears).
  #
  # Model initialisation is AUTOMATIC and split across two containers:
  #   tool-intent-model (one-shot): downloads the pinned GGUF from Hugging Face
  #     into the `toolintent-cache` volume through the shared `model_store`
  #     package (size + SHA256 verified, interrupted transfers resume), then
  #     exits 0. It skips the download entirely when `.model-ready.json` says
  #     those bytes are already registered.
  #   tool-intent (below): stock Ollama, no curl and no apt. It registers the
  #     file with `ollama create`, verifies the resulting blob digest equals the
  #     pinned SHA256, writes `.model-ready.json`, deletes the staging copy, and
  #     serves. compose waits for the init service to complete successfully, so
  #     an unverified download never starts a serving container.
  # No manual `ollama pull` and no host path is involved. `docker compose down`
  # keeps the volume; `docker compose down -v` deletes it (next boot
  # re-downloads ~444 MB). The healthcheck below only passes once the model is
  # registered.
  # Host wiring (app .env, gitignored):
  #   CHAT_TOOL_INTENT_LOCAL_URL=http://localhost:18091/v1
  #   CHAT_TOOL_INTENT_LOCAL_MODEL=delveta-pe:q5km   (config default; set only to deviate)
  tool-intent-model:
    build:
      context: ./deploy
      dockerfile: tool_intent/init.Dockerfile
    image: delveta-tool-intent-init:latest
    volumes:
      - toolintent-cache:/root/.ollama
    environment:
      <<: *tool-intent-model
    # One-shot: exit 0 means "bytes are published", non-zero blocks tool-intent.
    restart: "no"

  tool-intent:
    build:
      context: ./deploy
      dockerfile: tool_intent/Dockerfile
    image: delveta-tool-intent:latest
    container_name: delveta-tool-intent
    ports:
      # loopback-only, same doctrine as stt: the host-run API reaches it at
      # http://localhost:18091/v1; nothing outside this machine serves intents.
      - "127.0.0.1:18091:11434"
    volumes:
      - toolintent-cache:/root/.ollama
    environment:
      <<: *tool-intent-model
      OLLAMA_KEEP_ALIVE: "24h"     # ms-level first hop needs a warm model in RAM
      OLLAMA_MODEL: ${TOOL_INTENT_OLLAMA_MODEL:-delveta-pe:q5km}
    depends_on:
      tool-intent-model:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Healthy only when the model is registered — an API-up-but-empty volume
      # during initialisation must not be reported as ready.
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL}\""]
      interval: 10s
      timeout: 10s
      retries: 12
      # Generous: a cold volume downloads and verifies ~444 MB first.
      start_period: 1800s

  # ── cap_router (capability-selection model service) ──────────────────────────
  # Built locally from deploy/laya; speaks the TypeSafe Jev POST /v1/systemone
  # wire (one choice question per turn). The current model implementation is
  # LayaChoice-v2 (4-slot contract: 3 capability cards + the REJECT card).
  #
  # The ~0.64 GB checkpoint lives in the Docker-managed named volume `laya-model`,
  # NOT on a host path: the entrypoint downloads the configured revision,
  # verifies every file's size + SHA256, and publishes it under
  # /models/layachoice/current before the server starts. Container recreation
  # reuses the volume; `docker compose down` keeps it; only
  # `docker compose down -v` deletes it (the next boot re-downloads ~678 MB).
  #
  # Model pins are NOT in the image. They arrive as MODEL_SPEC_JSON from
  # deploy/model_config/layachoice.env (Compose env_file, read at container
  # creation). To change a model: edit that file, then
  #   docker compose up -d --force-recreate cap-router
  # No image rebuild and no host mount is involved. `docker compose restart`
  # does NOT pick up a new env file value.
  # Host port is bound to loopback only, the same doctrine as stt/tool-intent:
  # the host-run API reaches it at http://localhost:18092. Host wiring (app .env,
  # gitignored):
  #   CHAT_CAP_ROUTER_URL=http://localhost:18092
  # start_period is generous: a cold volume downloads first, then the FP32
  # checkpoint loads onto CPU and is warmed with one forward pass.
  cap-router:
    build:
      context: ./deploy
      dockerfile: laya/Dockerfile
    image: delveta-cap-router:latest
    container_name: delveta-cap-router
    ports:
      - "127.0.0.1:18092:8000"
    env_file:
      - ./deploy/model_config/layachoice.env
    volumes:
      - laya-model:/models/layachoice
    environment:
      LAYA_DEVICE: cpu
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      # See the note on the tool-intent model pin above: HTTP partials live in
      # the volume, so an interrupted download resumes after a container swap.
      HF_HUB_DISABLE_XET: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 1800s

  # ── LLM gateway (LiteLLM proxy) ───────────────────────────────────────
  # The API calls a virtual model name (LLM_MODEL=delveta-chat); LiteLLM routes it to
  # the real upstream provider (set via LLM_UPSTREAM_* in .env), with key management,
  # cost tracking, rate limits, and per-model fallback all in one place.
  llm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: delveta-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # 4000 sits inside a Windows Hyper-V excluded port range (3984-4083) on this host; use 14000.
      - "14000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-gateway}
      LLM_UPSTREAM_MODEL: ${LLM_UPSTREAM_MODEL:-openai/gpt-4o-mini}
      LLM_UPSTREAM_BASE: ${LLM_UPSTREAM_BASE:-https://api.openai.com/v1}
      LLM_UPSTREAM_KEY: ${LLM_UPSTREAM_KEY:-sk-xxx}
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      # The litellm image ships no curl/wget — probe via its bundled python.
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Worker (arq) ─────────────────────────────────────────────────────
  # Executes enrichment jobs (TTS / image fetch / explain / definition / syntax analysis /
  # sentence indexing / session finalize) enqueued by the FastAPI gateway. PostgreSQL's jobs
  # table is the source of truth for job state; Redis only carries the work to this worker.
  worker:
    build:
      context: .
      dockerfile: deploy/worker/Dockerfile
    container_name: delveta-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://delveta:delveta@postgres:5432/delveta
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_BASE_URL: http://embedding:80
      LLM_BASE_URL: http://llm-gateway:4000/v1
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-gateway}
      LLM_MODEL: delveta-chat
      TTS_BASE_URL: http://tts:8880/v1
      # Web search provider: add WEB_SEARCH_PROVIDER=tavily and WEB_SEARCH_API_KEY to the
      # compose .env (gitignored) to make the worker use Tavily. Defaults keep the keyless
      # aggregate active when neither is set.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-aggregate}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      # Ops: dump the full adjudication prompt + raw LLM reply to the worker log.
      RESEARCH_ADJ_DUMP: ${RESEARCH_ADJ_DUMP:-1}
    volumes:
      # Share the audio/image caches with the host-run FastAPI gateway, which serves /audio
      # and /images from the same directories.
      - ./data:/app/data
      # Version-controlled skills: research auto-run turns load deep_research.skill.md via the
      # agent's `skill` tool, so the worker must see ./skills (mirror of ./plugins below).
      - ./skills:/app/skills
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding:
        condition: service_healthy
      tts:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ── Retrieval service (RAG pipeline over gRPC) ───────────────────────
  # Owns the whole retrieval stack (embedding → recall → RRF → rerank → rewrite) behind a
  # single Retrieve(query, top_k, filters) RPC. The API switches to this via RETRIEVAL_MODE=grpc.
  retrieval:
    build:
      context: .
      dockerfile: deploy/retrieval/Dockerfile
    container_name: delveta-retrieval
    environment:
      DATABASE_URL: postgresql+asyncpg://delveta:delveta@postgres:5432/delveta
      EMBEDDING_BASE_URL: http://embedding:80
      RERANKER_MODEL: ""            # in-process cross-encoder rerank; "" disables reranking (the TEI reranker container is legacy, not wired)
      RAG_QUERY_REWRITE: "true"
      LLM_BASE_URL: http://llm-gateway:4000/v1
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-gateway}
      LLM_MODEL: delveta-chat
      RETRIEVAL_GRPC_ADDR: 0.0.0.0:50051
    ports:
      - "15051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ── Edge gateway (Traefik) ───────────────────────────────────────────
  # Single entrypoint on the machine's LAN IP (by IP for now, no DNS/TLS): :80 serves the
  # web console + ``/api/*`` → host-run FastAPI (host.docker.internal:8300); :15052 carries
  # retrieval gRPC. The FastAPI app still runs on the host during development.
  traefik:
    image: traefik:v3.0
    container_name: delveta-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "15052:50052"
      - "8082:8080"   # dashboard (insecure, dev only)
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  reranker-cache:
  kokoro-cache:
  funasr-cache:
  toolintent-cache:
  # Model checkpoints owned by Docker, initialised by each service's entrypoint.
  # `docker compose down -v` removes them and forces a re-download on next boot.
  embedding-model:
  laya-model:
